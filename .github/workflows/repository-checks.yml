name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify tracked source manifest
        run: python scripts/project_manifest.py --check

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libservlet-api-java

      - name: Fetch verified process-control test dependency
        run: |
          mkdir -p "$RUNNER_TEMP/vibe-deps"
          curl --fail --location --retry 2 \
            https://github.com/opensagetv-vibe/opensagetv-vibe-FFmpeg-Plugin/releases/download/v0.1.36/SageTVFFmpegPlugin-jar-0.1.36.zip \
            --output "$RUNNER_TEMP/vibe-deps/provider.zip"
          printf '%s  %s\n' 60d58439250eec189fd3002088a0f869389bd16a2b901cb3054f9286705a9274 "$RUNNER_TEMP/vibe-deps/provider.zip" | sha256sum --check --strict
          unzip -p "$RUNNER_TEMP/vibe-deps/provider.zip" SageTVFFmpegPlugin.jar > "$RUNNER_TEMP/vibe-deps/SageTVFFmpegPlugin.jar"

      - name: Build package
        run: |
          bash scripts/build-local.sh
          python scripts/package-local-plugin.py

      - name: Run generated and source validation
        env:
          TEST_FFMPEG: /usr/bin/ffmpeg
          SAGETV_FFMPEG_PLUGIN_JAR: ${{ runner.temp }}/vibe-deps/SageTVFFmpegPlugin.jar
        run: bash scripts/validate.sh

      - name: Verify Vibe project contracts
        run: |
          test -x dev.sh
          test -x update.sh
          grep -Fq '<Plugin>SageTVFFmpegPluginLinux</Plugin>' dist/local-install/SageTVPluginsDev.d/sagetv-webplayer.xml
          grep -Fq '<Plugin>SageTVFFmpegPluginWinx64</Plugin>' dist/local-install/SageTVPluginsDev.d/sagetv-webplayer-windows.xml
